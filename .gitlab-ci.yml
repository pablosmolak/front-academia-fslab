variables:
  KUBECTL_CONFIG: $KUBECTL_CONFIG
  IMAGEM_DOCKER: registry.fslab.dev/pablosmolak/academiafslab
  ENV_CONFIG: $ENV_CONFIG

stages:
  - build
  - deploy

buildar-docker:
  stage: build
  image: docker:dind
  only:
    - 8-configurando-next-auth
  script:
    - cat $ENV_CONFIG > .env
    - docker build -t $IMAGEM_DOCKER .
    - docker push $IMAGEM_DOCKER

fazer-deploy:
  stage: deploy
  needs: ["buildar-docker"]
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  only:
    - 8-configurando-next-auth
  script:
    - cat $KUBECTL_CONFIG > ~/.kube/config
    - kubectl config get-contexts
    - kubectl get node
    - kubectl get pods
    - kubectl delete deployment academiafslab || true
    - kubectl apply -f deployment.yaml
    - sleep 60
    - kubectl get pods
    - kubectl describe deploy/academiafslab
    - kubectl logs deploy/academiafslab
